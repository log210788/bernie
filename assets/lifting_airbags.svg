<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="slabGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="airbag" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Header Card -->
  <rect x="30" y="25" width="740" height="60" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="50" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">HIGH-PRESSURE HEAVY LIFTING AIRBAGS</text>
  <text x="50" y="73" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Cojines Neumáticos de Elevación • Up to 70 Tons Lifting Capacity</text>
  <rect x="630" y="38" width="125" height="32" rx="8" fill="#38bdf8"/>
  <text x="692" y="59" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">PNEUMATIC</text>

  <!-- Tilted Concrete Slab Being Lifted -->
  <polygon points="50,220 540,150 540,240 50,290" fill="url(#slabGrad)" stroke="#475569" stroke-width="2"/>
  <text x="260" y="200" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#f8fafc">12-TON REINFORCED CONCRETE SLAB</text>

  <!-- Lift Force Arrows -->
  <line x1="280" y1="230" x2="280" y2="160" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="273,165 287,165 280,150" fill="#38bdf8"/>
  <line x1="330" y1="230" x2="330" y2="160" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="323,165 337,165 330,150" fill="#38bdf8"/>
  <text x="360" y="185" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#38bdf8">SMOOTH LIFTING FORCE</text>

  <!-- High-Pressure Airbag (Inflated cushion) -->
  <rect x="210" y="250" width="180" height="60" rx="16" fill="url(#airbag)" stroke="#f59e0b" stroke-width="3"/>
  <!-- Dimpled Kevlar grip texture -->
  <line x1="225" y1="265" x2="375" y2="265" stroke="#404040" stroke-width="2" stroke-dasharray="4,6"/>
  <line x1="225" y1="280" x2="375" y2="280" stroke="#404040" stroke-width="2" stroke-dasharray="4,6"/>
  <line x1="225" y1="295" x2="375" y2="295" stroke="#404040" stroke-width="2" stroke-dasharray="4,6"/>
  <text x="300" y="285" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#f59e0b" text-anchor="middle">8.0 BAR (116 PSI) MAX</text>

  <!-- Brass Inlet Nipple on Airbag -->
  <rect x="188" y="272" width="22" height="16" rx="2" fill="#d97706" stroke="#b45309"/>

  <!-- High Pressure Yellow Hose -->
  <path d="M 188,280 C 130,280 110,380 200,430" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round"/>

  <!-- Dual Deadman Safety Controller (Control Unit) -->
  <rect x="180" y="405" width="140" height="90" rx="10" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <!-- Pressure Gauges -->
  <circle cx="215" cy="445" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <line x1="215" y1="445" x2="225" y2="435" stroke="#ef4444" stroke-width="2"/>
  <circle cx="285" cy="445" r="18" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <line x1="285" y1="445" x2="292" y2="438" stroke="#ef4444" stroke-width="2"/>
  <text x="250" y="485" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">DUAL CONTROLLER</text>

  <!-- Hose from Controller to SCBA Bottle -->
  <path d="M 320,450 C 370,450 400,440 430,460" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>

  <!-- SCBA Compressed Air Cylinder (300 Bar Bottle) -->
  <rect x="430" y="440" width="130" height="42" rx="14" fill="url(#bottle)" stroke="#a16207" stroke-width="2"/>
  <!-- Valve Head & Regulator -->
  <rect x="410" y="449" width="20" height="24" rx="3" fill="#64748b" stroke="#334155"/>
  <circle cx="415" cy="445" r="7" fill="#38bdf8"/>
  <text x="495" y="466" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#713f12">300 BAR CYLINDER</text>

  <!-- Safety Box Cribbing under lifted side -->
  <rect x="70" y="270" width="80" height="16" rx="2" fill="#d97706" stroke="#78350f"/>
  <rect x="75" y="254" width="70" height="16" rx="2" fill="#b45309" stroke="#78350f"/>
  <rect x="80" y="238" width="60" height="16" rx="2" fill="#d97706" stroke="#78350f"/>
  <text x="110" y="305" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#f59e0b" text-anchor="middle">SAFETY CRIBBING</text>

  <!-- Trapped Void Area Indicator -->
  <rect x="560" y="140" width="200" height="160" rx="10" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="660" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#f43f5e" text-anchor="middle">RESCUE VOID SPACE</text>
  <text x="660" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#f8fafc" text-anchor="middle">Victim pinned under concrete.</text>
  <text x="660" y="206" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">Airbag inserts into gaps as</text>
  <text x="660" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle">narrow as 2.5 cm (1 inch).</text>
  <path d="M 660,235 L 660,265 M 650,255 L 660,265 L 670,255" stroke="#f43f5e" stroke-width="2" fill="none"/>
  <text x="660" y="285" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#f43f5e" text-anchor="middle">ZERO SHOCK LIFT</text>

  <!-- Stable Ground Line -->
  <rect x="50" y="320" width="500" height="15" fill="#334155" rx="3"/>

  <!-- Footer Tip Banner -->
  <rect x="30" y="525" width="740" height="45" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="552" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">
    ⚠️ <tspan fill="#38bdf8" font-weight="800">Tactical Command:</tspan> "Deploy heavy lifting airbags under the north slab — lift slowly and crib as you go!"
  </text>
</svg>
