<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="headBlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0f172a"/>

  <!-- Header Card -->
  <rect x="30" y="20" width="740" height="60" rx="12" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <text x="50" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">SPINE BOARD &amp; CERVICAL COLLAR (EXTRICATION)</text>
  <text x="50" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Tabla Espinal Rígida y Collarín Cervical • Full Neuro-Spinal Immobilization</text>
  <rect x="630" y="34" width="125" height="32" rx="8" fill="#facc15"/>
  <text x="692" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">MEDICAL USAR</text>

  <!-- Long Spine Board (Horizontal Layout for Clarity) -->
  <rect x="70" y="190" width="660" height="220" rx="25" fill="url(#boardBg)" stroke="#854d0e" stroke-width="3" filter="url(#shadow3)"/>
  
  <!-- Handhold Slots (Cutouts around perimeter) -->
  <!-- Top edge slots -->
  <rect x="130" y="202" width="55" height="14" rx="7" fill="#0f172a"/>
  <rect x="220" y="202" width="55" height="14" rx="7" fill="#0f172a"/>
  <rect x="310" y="202" width="55" height="14" rx="7" fill="#0f172a"/>
  <rect x="400" y="202" width="55" height="14" rx="7" fill="#0f172a"/>
  <rect x="490" y="202" width="55" height="14" rx="7" fill="#0f172a"/>
  <rect x="580" y="202" width="55" height="14" rx="7" fill="#0f172a"/>
  <!-- Bottom edge slots -->
  <rect x="130" y="384" width="55" height="14" rx="7" fill="#0f172a"/>
  <rect x="220" y="384" width="55" height="14" rx="7" fill="#0f172a"/>
  <rect x="310" y="384" width="55" height="14" rx="7" fill="#0f172a"/>
  <rect x="400" y="384" width="55" height="14" rx="7" fill="#0f172a"/>
  <rect x="490" y="384" width="55" height="14" rx="7" fill="#0f172a"/>
  <rect x="580" y="384" width="55" height="14" rx="7" fill="#0f172a"/>
  <!-- Left and Right head/foot slots -->
  <rect x="80" y="275" width="14" height="50" rx="7" fill="#0f172a"/>
  <rect x="706" y="275" width="14" height="50" rx="7" fill="#0f172a"/>

  <!-- Immobilized Patient Silhouette (Head on left, feet on right) -->
  <!-- Head -->
  <ellipse cx="150" cy="300" rx="28" ry="24" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <!-- Cervical Collar (C-Collar around neck) -->
  <rect x="175" y="286" width="28" height="28" rx="6" fill="#f8fafc" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="189" cy="300" r="4" fill="#0f172a"/>
  <!-- Torso & Shoulders -->
  <rect x="200" y="250" width="150" height="100" rx="14" fill="url(#bodyGrad)"/>
  <!-- Pelvis & Upper Legs -->
  <rect x="350" y="260" width="160" height="80" rx="10" fill="url(#bodyGrad)"/>
  <!-- Lower Legs & Feet -->
  <rect x="510" y="270" width="150" height="60" rx="8" fill="url(#bodyGrad)"/>
  <rect x="655" y="265" width="20" height="70" rx="4" fill="#0284c7"/>

  <!-- Head Immobilizer Blocks (Red foam blocks on either side of head) -->
  <rect x="120" y="240" width="60" height="28" rx="6" fill="url(#headBlock)" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="120" y="332" width="60" height="28" rx="6" fill="url(#headBlock)" stroke="#7f1d1d" stroke-width="1.5"/>
  <!-- Forehead and Chin Straps -->
  <line x1="150" y1="240" x2="150" y2="360" stroke="#000" stroke-width="3" stroke-dasharray="3,3"/>
  <rect x="138" y="295" width="24" height="10" rx="3" fill="#1e293b"/>

  <!-- Spider Straps (Color-coded patient security webbing) -->
  <!-- Center spine runner strap -->
  <line x1="200" y1="300" x2="650" y2="300" stroke="#000" stroke-width="6"/>
  <!-- Shoulder V-straps (Green) -->
  <line x1="185" y1="230" x2="250" y2="300" stroke="#22c55e" stroke-width="5"/>
  <line x1="185" y1="370" x2="250" y2="300" stroke="#22c55e" stroke-width="5"/>
  <!-- Chest cross strap (Red) -->
  <line x1="260" y1="205" x2="260" y2="395" stroke="#ef4444" stroke-width="6"/>
  <!-- Pelvic cross strap (Orange) -->
  <line x1="390" y1="205" x2="390" y2="395" stroke="#f97316" stroke-width="6"/>
  <!-- Thigh cross strap (Blue) -->
  <line x1="500" y1="205" x2="500" y2="395" stroke="#3b82f6" stroke-width="6"/>
  <!-- Lower leg strap (Purple) -->
  <line x1="600" y1="205" x2="600" y2="395" stroke="#a855f7" stroke-width="6"/>

  <!-- Callouts & Tactical Notes -->
  <!-- Callout 1: C-Collar -->
  <path d="M 190,260 L 190,140 L 250,140" stroke="#ef4444" stroke-width="2" fill="none"/>
  <circle cx="190" cy="260" r="4" fill="#ef4444"/>
  <rect x="250" y="118" width="180" height="42" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="340" y="136" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">CERVICAL COLLAR (C-COLLAR)</text>
  <text x="340" y="150" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Restricts all cervical spine motion</text>

  <!-- Callout 2: Head Immobilizer -->
  <path d="M 150,230 L 150,120 L 90,120" stroke="#ef4444" stroke-width="2" fill="none"/>
  <circle cx="150" cy="230" r="4" fill="#ef4444"/>
  <rect x="20" y="100" width="135" height="42" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="87" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">HEAD BLOCKS</text>
  <text x="87" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Prevents lateral rotation</text>

  <!-- Callout 3: Rigid Backboard -->
  <path d="M 450,395 L 450,470 L 370,470" stroke="#facc15" stroke-width="2" fill="none"/>
  <circle cx="450" cy="395" r="4" fill="#facc15"/>
  <rect x="210" y="450" width="160" height="42" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
  <text x="290" y="468" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#fde047" text-anchor="middle">POLYETHYLENE BOARD</text>
  <text x="290" y="482" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">X-Ray translucent, buoyant</text>

  <!-- Callout 4: Spider Straps -->
  <path d="M 600,395 L 600,470 L 650,470" stroke="#a855f7" stroke-width="2" fill="none"/>
  <circle cx="600" cy="395" r="4" fill="#a855f7"/>
  <rect x="520" y="450" width="180" height="42" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="610" y="468" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#d8b4fe" text-anchor="middle">SPIDER STRAP HARNESS</text>
  <text x="610" y="482" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Locks torso, pelvis &amp; lower limbs</text>

  <!-- Bottom Handover Command Banner -->
  <rect x="30" y="525" width="740" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="547" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">
    📋 <tspan fill="#facc15" font-weight="800">Paramedic Handover:</tspan> "Patient immobilized on spine board with C-collar applied. Severe crush injury, stable airway."
  </text>
  <text x="400" y="563" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">
    Protocol: Always log-roll with 3 responders holding neck, torso, and legs in perfect alignment.
  </text>
</svg>
