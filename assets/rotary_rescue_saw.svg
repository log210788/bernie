<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sawBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sawOrange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="sparks">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sawBg)"/>

  <!-- Header Card -->
  <rect x="30" y="20" width="740" height="60" rx="12" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="50" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">ROTARY RESCUE SAW (DIAMOND CONCRETE BREACHER)</text>
  <text x="50" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Cortadora Rotativa de Rescate • Slicing Reinforced Concrete &amp; Steel Rebar</text>
  <rect x="630" y="34" width="125" height="32" rx="8" fill="#f97316"/>
  <text x="692" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">BREACHING</text>

  <!-- Heavy Reinforced Concrete Slab Being Cut -->
  <rect x="50" y="360" width="700" height="150" rx="6" fill="#334155" stroke="#475569" stroke-width="2"/>
  <text x="650" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#64748b" text-anchor="middle">REINFORCED CONCRETE</text>
  
  <!-- Cut Kerf / Trench Line -->
  <rect x="250" y="360" width="14" height="70" fill="#0f172a"/>

  <!-- Steel Rebar Grid exposed inside cut -->
  <line x1="100" y1="410" x2="600" y2="410" stroke="#71717a" stroke-width="5" stroke-dasharray="20,15"/>
  <line x1="200" y1="360" x2="200" y2="480" stroke="#71717a" stroke-width="5"/>
  <line x1="320" y1="360" x2="320" y2="480" stroke="#71717a" stroke-width="5"/>

  <!-- Circular Diamond Blade (Half penetrating concrete) -->
  <g transform="translate(257, 360)">
    <!-- Rotating blade disc -->
    <circle cx="0" cy="0" r="140" fill="url(#bladeGrad)" stroke="#64748b" stroke-width="3"/>
    <!-- Center arbor nut -->
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="#475569"/>
    <!-- Diamond segmented teeth on blade edge -->
    <circle cx="0" cy="0" r="136" fill="none" stroke="#f1f5f9" stroke-width="6" stroke-dasharray="14,10"/>
    <!-- Blade cooling expansion slots -->
    <line x1="-100" y1="0" x2="-35" y2="0" stroke="#1e293b" stroke-width="2"/>
    <line x1="100" y1="0" x2="35" y2="0" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="-100" x2="0" y2="-35" stroke="#1e293b" stroke-width="2"/>
    <line x1="0" y1="100" x2="0" y2="35" stroke="#1e293b" stroke-width="2"/>

    <!-- Sparks Flying at Contact Point -->
    <g filter="url(#sparks)">
      <line x1="0" y1="10" x2="120" y2="-30" stroke="#fde047" stroke-width="3"/>
      <line x1="0" y1="10" x2="140" y2="-10" stroke="#f59e0b" stroke-width="4"/>
      <line x1="0" y1="10" x2="110" y2="15" stroke="#ef4444" stroke-width="3"/>
      <line x1="0" y1="10" x2="90" y2="-50" stroke="#fde047" stroke-width="2"/>
    </g>
  </g>

  <!-- Protective Upper Blade Guard (Orange Magnesium Guard) -->
  <path d="M 130,320 A 155 155 0 0 1 390,260 L 350,220 A 175 175 0 0 0 110,320 Z" fill="url(#sawOrange)" stroke="#9a3412" stroke-width="2"/>

  <!-- Powerhead / Engine Body (Behind blade) -->
  <!-- 2-Stroke Gas Engine block -->
  <rect x="330" y="190" width="220" height="120" rx="16" fill="url(#sawOrange)" stroke="#9a3412" stroke-width="2"/>
  <!-- Engine Cooling Vents -->
  <rect x="360" y="210" width="80" height="8" rx="4" fill="#1e293b"/>
  <rect x="360" y="225" width="80" height="8" rx="4" fill="#1e293b"/>
  <rect x="360" y="240" width="80" height="8" rx="4" fill="#1e293b"/>
  <rect x="360" y="255" width="80" height="8" rx="4" fill="#1e293b"/>
  
  <!-- Top Handle / Carrying Bar -->
  <path d="M 280,210 L 280,150 L 460,150 L 460,190" fill="none" stroke="#64748b" stroke-width="12" stroke-linecap="round"/>
  <!-- Rear Throttle Handle -->
  <path d="M 540,240 L 610,240 L 610,290 L 540,280" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <!-- Safety Trigger -->
  <rect x="560" y="252" width="18" height="6" rx="2" fill="#ef4444"/>

  <!-- Air Filtration Snorkel Box -->
  <rect x="460" y="210" width="70" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="495" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">CYCLONE</text>
  <text x="495" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">AIR FILTER</text>

  <!-- Water Dust Suppression Hose Connection -->
  <line x1="220" y1="290" x2="250" y2="340" stroke="#38bdf8" stroke-width="4"/>
  <circle cx="250" cy="340" r="5" fill="#0284c7"/>

  <!-- Callouts & Technical Notes -->
  <!-- Callout 1: Diamond Blade -->
  <path d="M 180,270 L 110,210" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="180" cy="270" r="4" fill="#cbd5e1"/>
  <rect x="30" y="170" width="150" height="42" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="105" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">14-INCH DIAMOND BLADE</text>
  <text x="105" y="202" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">Cuts concrete, brick &amp; rebar</text>

  <!-- Callout 2: Water Suppression -->
  <path d="M 250,340 L 330,330" stroke="#38bdf8" stroke-width="2"/>
  <rect x="330" y="310" width="160" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="410" y="327" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle">WATER DUST SUPPRESSOR</text>
  <text x="410" y="341" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Prevents toxic silica dust</text>

  <!-- Bottom Operational Caution Banner -->
  <rect x="30" y="525" width="740" height="50" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="400" y="547" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">
    🔊 <tspan fill="#f97316" font-weight="800">Survivor Grounding Warning:</tspan> "Lewis, you will hear a loud motor and saw noise. Put this mask on and cover your eyes."
  </text>
  <text x="400" y="563" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" fill="#94a3b8" text-anchor="middle">
    Generates 115 dB of noise — rescuers must use verbal grounding before starting the cut.
  </text>
</svg>
